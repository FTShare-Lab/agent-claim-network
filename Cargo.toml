[package]
name = "agent-claim-network"
# ACN 产品版本的唯一来源；展示、锁文件与发布 tag 由版本一致性检查约束。
version = "0.2.1"
description = "A terminal agent and claim-based knowledge collaboration system"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/FTShare-Lab/agent-claim-network"
repository = "https://github.com/FTShare-Lab/agent-claim-network"
edition = "2021"
rust-version = "1.90"
default-run = "acn"
autobins = false

[[bin]]
name = "acn"
path = "src/bin/acn.rs"

[[bin]]
name = "acn-router"
path = "src/bin/router.rs"

[[bin]]
name = "acn-maintainer"
path = "src/bin/maintainer.rs"

[[bin]]
name = "acn_eval"
path = "src/bin/acn_eval.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"
libc = "0.2"
portable-pty = "0.9.0"
process-wrap = "9.1.0"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"

serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
toml = "0.8"

# 发布二进制使用 rustls，避免 Linux 运行时依赖特定版本的系统 OpenSSL；其余默认能力显式保留。
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls-tls-native-roots",
    "stream",
    "system-proxy",
] }
sse-stream = "0.2.3"
axum = "0.8"
rmcp = { version = "0.15.0", default-features = false, features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
rand = "0.8"
hex = "0.4"
rustc-hash = "2"
ring = "0.17"
shlex = "1.3"
subtle = "2"

ftlog = "0.2.16"
log = "0.4.32"

anyhow = "1"
thiserror = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

minijinja = "2.19"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1.12"
pulldown-cmark = "0.13"
num-traits = "0.2"
similar = "2"
tempfile = "3"

opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-langfuse = "0.6"
rusqlite = { version = "0.32.1", default-features = false, features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
rusttype = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = "0.5"
